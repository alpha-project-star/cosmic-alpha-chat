services:
  web:
    image: node:22
    working_dir: /app
    environment:
      - NODE_ENV=development
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - HOST=0.0.0.0
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    volumes:
      - ./:/app
      # keep container-installed node_modules from shadowing the bind mount
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install -g bun && bun install && bunx vite dev --port 3000 --host 0.0.0.0 --strictPort"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  node_modules:
